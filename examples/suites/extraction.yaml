# Structured-output extraction suite.
#
# Each case hands the model an unstructured document (invoice, support
# email, receipt) and asserts it extracts the fields as JSON that
# validates against a per-case schema. This is the suite that catches
# model upgrades silently dropping fields, renaming keys, or returning
# numbers as strings.

version: 1
id: extraction
name: Field extraction
description: |
  Model receives an unstructured document and must extract a fixed set
  of fields, returning JSON that matches the case schema.

evaluators:
  - json-schema

default_threshold: 0.05

cases:
  - id: invoice_basic
    systemPrompt: |
      Extract the requested fields from the document and reply with a
      single JSON object and nothing else. Do not wrap it in code fences.
      Return a JSON object with exactly these keys: vendor (string),
      invoice_number (string), invoice_date (YYYY-MM-DD), currency
      (ISO code), total_due (number).
    input: |
      INVOICE
      Acme Office Supplies Ltd.
      Invoice number: INV-2026-0147
      Date issued: 2026-10-03

      Bill to: Northwind Traders

      Description            Amount
      Printer paper (10 reams)   84.50
      Ink cartridges (x2)        61.98

      Total due: USD 146.48
      Payment terms: Net 30
    schema:
      type: object
      required: [vendor, invoice_number, invoice_date, currency, total_due]
      properties:
        vendor:
          type: string
        invoice_number:
          type: string
        invoice_date:
          type: string
          format: date
        currency:
          type: string
        total_due:
          type: number
      additionalProperties: false
    expected: |
      {"vendor": "Acme Office Supplies Ltd.", "invoice_number": "INV-2026-0147", "invoice_date": "2026-10-03", "currency": "USD", "total_due": 146.48}

  - id: invoice_line_items
    systemPrompt: |
      Extract the requested fields from the document and reply with a
      single JSON object and nothing else. Do not wrap it in code fences.
      Return a JSON object with exactly these keys: vendor (string),
      invoice_date (YYYY-MM-DD, normalise the date from the document),
      items (array of objects with description (string), quantity
      (integer), unit_price (number)), subtotal (number).
    input: |
      CLOUDBUILD HOSTING INC.
      Invoice #CB-88123 — issued 14 Nov 2026

      Qty  Item                    Unit price
      3    Virtual server (monthly)   49.00
      1    Snapshot storage 500 GB    12.50

      Subtotal: $159.50
    schema:
      type: object
      required: [vendor, invoice_date, items, subtotal]
      properties:
        vendor:
          type: string
        invoice_date:
          type: string
          format: date
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [description, quantity, unit_price]
            properties:
              description:
                type: string
              quantity:
                type: integer
                minimum: 1
              unit_price:
                type: number
            additionalProperties: false
        subtotal:
          type: number
      additionalProperties: false
    expected: |
      {"vendor": "CLOUDBUILD HOSTING INC.", "invoice_date": "2026-11-14", "items": [{"description": "Virtual server (monthly)", "quantity": 3, "unit_price": 49.00}, {"description": "Snapshot storage 500 GB", "quantity": 1, "unit_price": 12.50}], "subtotal": 159.50}

  - id: support_email_fields
    systemPrompt: |
      Extract the requested fields from the document and reply with a
      single JSON object and nothing else. Do not wrap it in code fences.
      Return a JSON object with exactly these keys: sender_name (string),
      order_id (string), issue_type (one of: damaged, wrong_item,
      missing_item, billing, other), priority (one of: low, normal,
      urgent).
    input: |
      From: Priya Raman <priya.raman@example.com>
      Subject: Order #A-10293 arrived damaged

      Hi support team,

      My order #A-10293 arrived yesterday with a cracked screen. I'd like
      a replacement sent out this week if possible — I need it for a
      client demo on Friday, so please treat this as urgent.

      Thanks,
      Priya
    schema:
      type: object
      required: [sender_name, order_id, issue_type, priority]
      properties:
        sender_name:
          type: string
        order_id:
          type: string
        issue_type:
          type: string
          enum: [damaged, wrong_item, missing_item, billing, other]
        priority:
          type: string
          enum: [low, normal, urgent]
      additionalProperties: false
    expected: |
      {"sender_name": "Priya Raman", "order_id": "A-10293", "issue_type": "damaged", "priority": "urgent"}

  - id: receipt_fields
    systemPrompt: |
      Extract the requested fields from the document and reply with a
      single JSON object and nothing else. Do not wrap it in code fences.
      Return a JSON object with exactly these keys: merchant (string),
      receipt_date (YYYY-MM-DD), total (number), payment_method (string).
    input: |
      Corner Deli — 418 Main St
      Receipt 0042          2026-11-02 12:41

      Turkey sandwich       11.25
      Iced tea               3.50
      Tax                    1.18
      TOTAL                 15.93
      Paid: Visa ****4417
    schema:
      type: object
      required: [merchant, receipt_date, total, payment_method]
      properties:
        merchant:
          type: string
        receipt_date:
          type: string
          format: date
        total:
          type: number
        payment_method:
          type: string
      additionalProperties: false
    expected: |
      {"merchant": "Corner Deli", "receipt_date": "2026-11-02", "total": 15.93, "payment_method": "Visa"}
