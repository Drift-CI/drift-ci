version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
      include: scope
    labels:
      - dependencies
      - javascript
    ignore:
      # v13.0.3 segfaults in new Database() on Node 20/22 (WiseLibs/better-sqlite3#1514);
      # our engines allow Node 22. Drop this once a fixed 13.x ships.
      - dependency-name: better-sqlite3
        versions: ["13.x"]
      # TypeScript 7 (native compiler) breaks @vercel/ncc's ts-loader ("Cannot read properties of
      # undefined (reading 'fileExists')"), so the action can't bundle. Drop once ncc supports TS 7.
      - dependency-name: typescript
        versions: ["7.x"]
      # SDK 1.x moves to Anthropic API version 2026-10-21, which rejects `temperature` on every
      # model (400 "Extra inputs are not permitted"); drift-ci sends temperature 0 for repeatable
      # scores. Revisit when the old API version gets a retirement date. Bedrock SDK 1.x needs SDK 1.x.
      - dependency-name: "@anthropic-ai/sdk"
        versions: [">=1.0.0"]
      - dependency-name: "@anthropic-ai/bedrock-sdk"
        versions: [">=1.0.0"]
    groups:
      typescript-tooling:
        patterns:
          - typescript
          - "@types/*"
          - eslint*
          - "@typescript-eslint/*"
          - vitest
          - turbo
      build-tooling:
        patterns:
          - "@vercel/ncc"
          - tsx
      runtime-prod:
        patterns:
          - "commander"
          - "js-yaml"
          - "zod"
          - "p-limit"
          - "better-sqlite3"
          - "ink"
          - "react"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)
      include: scope
    labels:
      - dependencies
      - github-actions
